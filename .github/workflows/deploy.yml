name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::752613019381:role/StoryBankGitHubDeploy
          aws-region: us-east-1

      - name: Look up stack outputs
        run: |
          out() { aws cloudformation describe-stacks --stack-name StoryBank \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "BUCKET=$(out BucketName)" >> "$GITHUB_ENV"
          echo "DISTRIBUTION=$(out DistributionId)" >> "$GITHUB_ENV"

      # Only publish the site files — never sync the whole checkout.
      - name: Sync to S3
        run: |
          mkdir site
          cp index.html stories.json og-image.png robots.txt sitemap.xml site/
          aws s3 sync site/ "s3://$BUCKET/" --delete
          aws s3 cp site/stories.json "s3://$BUCKET/stories.json" --content-type application/json

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/*'
